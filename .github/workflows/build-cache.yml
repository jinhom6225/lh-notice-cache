name: Build LH notice cache

# Every run also (LH청약알리미 plan A9):
#   - sends a Telegram notice: every failure, and one success summary a day
#     (the 06:23 KST run) plus every manual run
#     (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID; skipped if unset)
#   - re-enables this workflow so GitHub's 60-day inactivity pause on
#     public-repo schedules never kicks in (keepalive job)

on:
  schedule:
    # UTC 21,03,09,15 = KST 06,12,18,24, at :23 rather than on the hour
    # (GitHub delays or drops on-the-hour schedules more often; plan A10).
    # The 06:23 KST entry is its own line so the success notice can be
    # limited to it (github.event.schedule).
    - cron: "23 21 * * *"
    - cron: "23 3,9,15 * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Fail before building (checks the failure notice)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Forced failure
        if: inputs.force_fail
        run: |
          echo "force_fail=true: failing on purpose to check the Telegram failure notice"
          exit 1

      - name: Check secret
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_API_KEY" ]; then
            echo "::error::Repository secret DATA_GO_KR_API_KEY is not set. Add it under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # build_cache.py redacts the key from everything it prints; only its
      # final "... stats={...}" line goes into the Telegram notice.
      - name: Build cache
        id: build
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/build.log"
          python scripts/build_cache.py --output docs/lh_cache_v1.json --deadline-seconds 1200 --verbose 2>&1 | tee "${log}"
          stats="$(grep -E '^(wrote|cache unchanged).* stats=[{].*[}]$' "${log}" | tail -1 | sed 's/.* stats=//' || true)"
          echo "stats=${stats}" >> "${GITHUB_OUTPUT}"

      - name: Commit cache if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- docs/lh_cache_v1.json)" ]; then
            echo "Cache unchanged."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lh_cache_v1.json
          git commit -m "chore: update lh cache $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M%z)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      # Failures always; success only for the 06:23 KST schedule and manual runs.
      - name: Telegram notice
        if: >-
          always() && (job.status != 'success'
          || github.event_name == 'workflow_dispatch'
          || github.event.schedule == '23 21 * * *')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          STATS: ${{ steps.build.outputs.stats }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          TRIGGER: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${STATUS}" = "success" ]; then
            text="$(printf 'lh-notice-cache 캐시 생성 ✅\n%s\n캐시 변경: %s\n실행: %s' \
              "${STATS:-요약 없음}" "${CHANGED:-false}" "${TRIGGER}")"
          else
            text="$(printf '❌ lh-notice-cache 캐시 생성 실패 (%s, %s)\n%s' "${STATUS}" "${TRIGGER}" "${RUN_URL}")"
          fi
          echo "${text}"
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; Telegram notices are off"
            exit 0
          fi
          curl --silent --show-error --fail --max-time 15 -o /dev/null \
            -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            || echo "::warning::Telegram send failed"

  # Re-enabling an enabled workflow is a no-op that counts as activity, so
  # the schedule is not paused after 60 quiet days (plan A9). Independent of
  # the build job so it runs even when building fails.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method PUT "repos/${REPO}/actions/workflows/build-cache.yml/enable" --silent \
            && echo "keepalive: workflow re-enabled" \
            || echo "::warning::keepalive: could not re-enable the workflow"
