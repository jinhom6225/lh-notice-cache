name: Build LH notice cache

on:
  schedule:
    # UTC 21,03,09,15 = KST 06,12,18,24
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secret
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_API_KEY" ]; then
            echo "::error::Repository secret DATA_GO_KR_API_KEY is not set. Add it under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build cache
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/build_cache.py --output docs/lh_cache_v1.json --deadline-seconds 1200 --verbose

      - name: Commit cache if changed
        run: |
          if [ -z "$(git status --porcelain -- docs/lh_cache_v1.json)" ]; then
            echo "Cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lh_cache_v1.json
          git commit -m "chore: update lh cache $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M%z)"
          git pull --rebase origin main
          git push origin HEAD:main
